name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.*', '13.*']
        dependencies: [highest]
        include:
          # One lowest-dependency run on the oldest supported Laravel, so the
          # declared minimums are real.
          - php: '8.2'
            laravel: '12.*'
            dependencies: lowest
        exclude:
          # Laravel 13 requires PHP 8.3 or newer.
          - php: '8.2'
            laravel: '13.*'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, json
          coverage: none

      - name: Pin the Laravel version under test
        run: composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update --no-interaction

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run the test suite
        run: vendor/bin/phpunit

  quality:
    runs-on: ubuntu-latest
    name: Static analysis and code style

    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sodium, json
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check the code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M
